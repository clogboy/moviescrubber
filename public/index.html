<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieScrubber - Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .nav a {
      color: #667eea;
      text-decoration: none;
    }

    .btn-refresh {
      padding: 0.5rem 1rem;
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-refresh:hover {
      background: #333;
      border-color: #667eea;
    }

    .btn-refresh:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-refresh.loading {
      animation: pulse 1.5s infinite;
    }

    .search-box {
      position: relative;
      margin-bottom: 2rem;
    }

    #searchInput {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 12px;
      color: #e0e0e0;
      transition: all 0.3s;
    }

    #searchInput:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .search-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #888;
    }

    .section-title {
      font-size: 1.2rem;
      color: #667eea;
      margin-bottom: 1rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .result-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .result-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
    }

    .result-card::after {
      content: '→';
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      color: #667eea;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .result-card:hover::after {
      opacity: 1;
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .favicon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .result-title {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .page-title {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.4;
      margin-top: 0.5rem;
    }

    .result-meta {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .meta-badge {
      padding: 0.25rem 0.75rem;
      background: #2a2a2a;
      border-radius: 20px;
      color: #888;
    }

    .meta-badge.popular {
      background: #667eea;
      color: white;
    }

    .result-domain {
      color: #667eea;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #666;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .debug-info {
      background: #1a1a1a;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border-left: 4px solid #f44336;
      font-size: 0.9rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading {
      animation: pulse 2s infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn-refresh.loading .icon {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 MovieScrubber</h1>
      <p class="subtitle">Search your streaming catalog</p>
    </header>

    <div class="nav">
      <a href="/dashboard">→ Dashboard</a>
      <button id="btnRefresh" class="btn-refresh" onclick="refreshData()">
        <span class="icon">🔄</span>
        <span class="text">Refresh</span>
      </button>
    </div>

    <div id="debugInfo" class="debug-info" style="display: none;"></div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search for movies or shows..."
        autocomplete="off"
      >
    </div>

    <div id="searchStats" class="search-stats" style="display: none;">
      <span id="resultCount">0 results</span>
      <span id="searchTime"></span>
    </div>

    <div id="resultsContainer"></div>
  </div>

  <script>
    let searchTimeout;
    let allLinks = [];
    let faviconCache = {};

    // Debug function
    function debug(message, data = null) {
      console.log('[DEBUG]', message, data);
      const debugDiv = document.getElementById('debugInfo');
      debugDiv.style.display = 'block';
      debugDiv.innerHTML = '<strong>Debug:</strong> ' + message +
        (data ? '<br><pre>' + JSON.stringify(data, null, 2).substring(0, 200) + '...</pre>' : '');
    }

    // Refresh data
    window.refreshData = async function() {
      const btn = document.getElementById('btnRefresh');
      const text = btn.querySelector('.text');
      const originalText = text.textContent;

      btn.disabled = true;
      btn.classList.add('loading');
      text.textContent = 'Refreshing...';

      try {
        await loadAllLinks();
        text.textContent = '✓ Refreshed!';
        setTimeout(() => {
          text.textContent = originalText;
          btn.classList.remove('loading');
          btn.disabled = false;
        }, 1500);
      } catch (err) {
        text.textContent = '✗ Failed';
        setTimeout(() => {
          text.textContent = originalText;
          btn.classList.remove('loading');
          btn.disabled = false;
        }, 2000);
      }
    };

    // Load all links on startup
    async function loadAllLinks() {
      try {
        debug('Fetching links from /api/links...');
        const response = await fetch('/api/links');

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        allLinks = await response.json();
        debug(`Loaded ${allLinks.length} links`, allLinks[0]);
        console.log('All links:', allLinks);

        if (allLinks.length === 0) {
          debug('⚠️ No links in database. Run search mode first!');
        } else {
          document.getElementById('debugInfo').style.display = 'none';
        }

        // Re-render current view
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
          showTopPopular();
        } else {
          performSearch(query);
        }
      } catch (err) {
        console.error('Failed to load links:', err);
        debug('❌ Error loading links: ' + err.message);
        showErrorState(err.message);
      }
    }

    // Show top 10 most popular (available) links
    function showTopPopular() {
      const container = document.getElementById('resultsContainer');
      const stats = document.getElementById('searchStats');

      // Filter: only available links (checked and working)
      const availableLinks = allLinks.filter(link => link.available === 1);

      // Sort by title
      const topLinks = availableLinks.slice(0, 10);

      stats.style.display = 'none';

      if (topLinks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎬</div>
            <h3>No verified links yet</h3>
            <p>Database contains ${allLinks.length} links, but none have been verified as available.</p>
            <p style="margin-top: 1em; color: #888;">Run check mode to verify links</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '<div class="section-title">🔥 Top Available Content</div><div class="results-grid"></div>';
      const grid = container.querySelector('.results-grid');

      topLinks.forEach(link => {
        const card = createResultCard(link, true);
        grid.appendChild(card);
      });
    }

    // Search with debounce
    function handleSearch() {
      clearTimeout(searchTimeout);
      const query = document.getElementById('searchInput').value.trim();

      if (!query) {
        showTopPopular();
        return;
      }

      searchTimeout = setTimeout(() => {
        performSearch(query);
      }, 300);
    }

    // Perform search
    function performSearch(query) {
      const startTime = Date.now();
      const lowerQuery = query.toLowerCase();

      debug(`Searching for: "${query}" in ${allLinks.length} links`);

      const results = allLinks.filter(link =>
        link.title.toLowerCase().includes(lowerQuery) ||
        (link.page_title && link.page_title.toLowerCase().includes(lowerQuery)) ||
        link.domain.toLowerCase().includes(lowerQuery)
      );

      const searchTime = Date.now() - startTime;
      console.log(`Found ${results.length} results in ${searchTime}ms`);
      displayResults(results, searchTime);
    }

    // Display results
    function displayResults(results, searchTime) {
      const container = document.getElementById('resultsContainer');
      const stats = document.getElementById('searchStats');
      const resultCount = document.getElementById('resultCount');
      const searchTimeEl = document.getElementById('searchTime');

      if (results.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <h3>No results found</h3>
            <p>Try a different search term</p>
          </div>
        `;
        stats.style.display = 'none';
        return;
      }

      stats.style.display = 'flex';
      resultCount.textContent = `${results.length} result${results.length !== 1 ? 's' : ''}`;
      searchTimeEl.textContent = `${searchTime}ms`;

      container.innerHTML = '<div class="results-grid"></div>';
      const grid = container.querySelector('.results-grid');

      results.forEach(link => {
        const card = createResultCard(link, false);
        grid.appendChild(card);
      });
    }

    // Create result card
    function createResultCard(link, isPopular = false) {
      const card = document.createElement('a');
      card.className = 'result-card';
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const favicon = getFavicon(link.domain);
      const type = link.type === 'movie' ? '🎬 Movie' : '📺 Show';
      const popularBadge = isPopular ? '<span class="meta-badge popular">🔥 Popular</span>' : '';

      // Use page_title if available, otherwise fall back to search title
      const displayTitle = link.page_title || link.title;
      const showSearchTitle = link.page_title && link.page_title !== link.title;

      card.innerHTML = `
        <div class="result-header">
          <img src="${favicon}" class="favicon" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22><rect width=%2224%22 height=%2224%22 fill=%22%23333%22/></svg>'">
          <div>
            <div class="result-title">${escapeHtml(displayTitle)}</div>
            ${showSearchTitle ? '<div class="page-title">Search: ' + escapeHtml(link.title) + '</div>' : ''}
          </div>
        </div>

        <div class="result-meta">
          ${popularBadge}
          <span class="meta-badge">${type}</span>
          <span class="meta-badge">${link.domain}</span>
        </div>

        <div class="result-domain">
          🔗 Click to open on ${link.domain}
        </div>
      `;

      return card;
    }

    // Get favicon URL (cached)
    function getFavicon(domain) {
      if (!faviconCache[domain]) {
        faviconCache[domain] = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      }
      return faviconCache[domain];
    }

    // Show error state
    function showErrorState(message) {
      const container = document.getElementById('resultsContainer');
      const stats = document.getElementById('searchStats');

      stats.style.display = 'none';
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <h3>Error loading links</h3>
          <p>${message}</p>
          <p style="margin-top: 1em;">
            <a href="/dashboard" style="color: #667eea;">Check the dashboard</a>
          </p>
        </div>
      `;
    }

    // Utility functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    document.getElementById('searchInput').addEventListener('input', handleSearch);
    loadAllLinks();
  </script>
</body>
</html>
